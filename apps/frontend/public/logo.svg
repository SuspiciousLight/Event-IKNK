<svg width="120" height="120" viewBox="0 0 130 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Логотип приложения">
  <defs>
    <linearGradient id="holo" x1="20" y1="8" x2="104" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6633FF"/>
      <stop offset="0.42" stop-color="#CCAAFF"/>
      <stop offset="0.72" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8A66FF"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#CCAAFF" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- faceted holographic cursor / arrow -->
    <path d="M30 12 L30 120 L54 96 L72 138 L84 132 L66 90 L96 90 Z"
          fill="url(#holo)" stroke="#15101F" stroke-width="4" stroke-linejoin="round"/>
    <!-- crystalline facet lines -->
    <g stroke="#15101F" stroke-width="2" stroke-opacity="0.45" stroke-linejoin="round" fill="none">
      <path d="M30 12 L96 90"/>
      <path d="M30 12 L66 90"/>
      <path d="M30 12 L54 96"/>
      <path d="M30 120 L66 90"/>
    </g>
    <!-- light + indigo facets for the iridescent look -->
    <path d="M30 12 L96 90 L66 90 Z" fill="#FFFFFF" fill-opacity="0.20"/>
    <path d="M30 12 L54 96 L30 120 Z" fill="#6633FF" fill-opacity="0.22"/>
    <path d="M66 90 L72 138 L84 132 Z" fill="#FFFFFF" fill-opacity="0.14"/>
  </g>
</svg>
