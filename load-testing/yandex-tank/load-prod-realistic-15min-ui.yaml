core:
  artifacts_base_dir: /var/loadtest/tank-artifacts

phantom:
  address: event-iknk.ru
  port: "443"
  ssl: true
  ammo_type: phantom
  ammofile: ammo-prod-realistic.generated.phantom
  header_http: '1.1'
  load_profile:
    load_type: rps
    # 15 minutes of realistic user traffic waves.
    schedule: line(5, 20, 2m) const(20, 2m) line(20, 8, 1m) const(8, 1m) line(8, 30, 3m) const(30, 2m) line(30, 12, 1m) line(12, 35, 1m) const(35, 1m) line(35, 5, 1m)
  timeout: 5s

autostop:
  autostop:
    - http(5xx,5%,20s)
    - net(xx,1,30s)
    - time(1500ms,30s)

console:
  short_only: false
  info_panel_width: 42
  max_case_len: 38
  cases_sort_by: count
  cases_max_spark: 70
  sizes_max_spark: 70
  times_max_spark: 70

json_report:
  enabled: true
  test_data_log: test_data.log
  monitoring_log: monitoring.log

telegraf:
  config: none
