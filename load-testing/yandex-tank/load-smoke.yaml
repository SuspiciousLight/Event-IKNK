phantom:
  address: host.docker.internal:3000
  ammo_type: uri
  ammofile: ammo.uri
  header_http: '1.1'
  load_profile:
    load_type: rps
    schedule: const(2,30s)
  timeout: 5s

autostop:
  autostop:
    - http(5xx,1%,5s)
    - net(xx,1,10s)

console:
  short_only: true

telegraf:
  config: none
